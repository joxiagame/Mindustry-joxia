<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindustry Classic — Lanceur web</title>
    <link href="styles.css" rel="stylesheet" type="text/css">
    <style>
        *{
            font-family:Arial, Helvetica, sans-serif;
        }
        body{
            margin:0;
        }
        a{
            display:block;
            color:cyan;
            text-align:center;
        }
        .title{
            min-width:300px;
            image-rendering:crisp-edges;
            display:block;
            margin:auto;
        }
        .save-menu{
            width:300px;
            margin:auto;
        }
        p{
            color:white;
        }
    </style>
</head>
<body>
<a href="https://joxiagame.github.io/Joxia-Games/" id="joxia-quit" style="position:fixed;top:8px;left:8px;z-index:2147483647;display:flex;align-items:center;gap:6px;background:rgba(20,22,30,.86);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 11px;font:700 13px system-ui,-apple-system,sans-serif;text-decoration:none;box-shadow:0 3px 12px rgba(0,0,0,.45)">🏠 Quitter</a>
    <img src="title.png" class="title">
    <br>
    <a href="game.html">Lancer le jeu</a>
    <hr>
    <div class="save-menu">
        <p><i>L’export/import de sauvegardes précises depuis le lanceur arrive bientôt !</i></p>
        <button id="export-save">Exporter les sauvegardes</button>
        <button id="import-save">Importer les sauvegardes</button>
    </div>

    <script>

        // Dear stackoverflow... https://stackoverflow.com/questions/13405129/create-and-save-a-file-with-javascript
        function download(data, filename, type="plain/text") {
            var file = new Blob([data], {type: type});
            if (window.navigator.msSaveOrOpenBlob) // IE10+
                window.navigator.msSaveOrOpenBlob(file, filename);
            else { // Others
                var a = document.createElement("a"),
                        url = URL.createObjectURL(file);
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(function() {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);  
                }, 0); 
            }
        }

        function upload(){
            let input = document.createElement("input")
            input.type = "file"
            input.style.display="none"
            document.body.appendChild(input)
            input.click()
            input.remove()

            input.addEventListener("change", ()=>{
                const selectedFile = input.files[0];
                console.log(selectedFile)


                const reader = new FileReader();
                reader.onload = (e) => {
                    let parsed = JSON.parse(e.target.result)
                    if(!confirm("Voulez-vous vraiment continuer ? Votre sauvegarde actuelle sera remplacée !"))return;
                    localStorage.clear()
                    for(let key of Object.keys(parsed)){
                        localStorage.setItem(key, parsed[key])
                    }
                };
                reader.readAsText(selectedFile);
            })
        }

        document.getElementById("export-save").addEventListener("click", ()=>{
            download(JSON.stringify(localStorage), "mindustry-classic-web.save")
        })
        document.getElementById("import-save").addEventListener("click", upload)


    </script>
</body>
</html>
